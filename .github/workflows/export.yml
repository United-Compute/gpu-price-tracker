name: Export data

# Publishes the open dataset in data/ once a day (and on demand): current offers, reference
# tables, and one history file per finished UTC day.
on:
  schedule:
    - cron: "25 0 * * *"
  workflow_dispatch:

concurrency:
  group: export
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The collector's code is private (yachty66/gpu-index); this public repo runs it and
      # publishes the data. Read-only deploy key.
      - uses: actions/checkout@v4
        with:
          repository: yachty66/gpu-index
          ssh-key: ${{ secrets.GPU_INDEX_DEPLOY_KEY }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: pip install -r src/requirements.txt
      - name: Export
        working-directory: src
        run: python -m collector.export ../data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
      # Same files on Hugging Face (huggingface.co/datasets/united-compute/gpu-prices), with a
      # dataset card generated from the schema. Repo secret HF_TOKEN: fine-grained, write access
      # to the united-compute org.
      - name: Mirror to Hugging Face
        working-directory: src
        run: |
          pip install -q "huggingface_hub>=0.26"
          python -m collector.hf ../data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
