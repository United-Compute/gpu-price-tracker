name: Collect GPU offers

on:
  schedule:
    - cron: "4,19,34,49 * * * *"   # every 15 min, off the busy :00 slot; stock changes within minutes
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The collector's code is private (yachty66/gpu-index); this public repo runs it and
      # publishes the data. Read-only deploy key.
      - uses: actions/checkout@v4
        with:
          repository: yachty66/gpu-index
          ssh-key: ${{ secrets.GPU_INDEX_DEPLOY_KEY }}
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: pip install -r src/requirements.txt
      - name: Apply database migrations
        working-directory: src
        run: python -m collector.migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Collect
        working-directory: src
        run: python -m collector.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # One line per cloud key (GitHub does not run workflows that pass toJSON(secrets)).
          LYCEUM_API_KEY: ${{ secrets.LYCEUM_API_KEY }}
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
          HYPERSTACK_API_KEY: ${{ secrets.HYPERSTACK_API_KEY }}
          VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
          VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
          MASSED_COMPUTE_API_KEY: ${{ secrets.MASSED_COMPUTE_API_KEY }}
          NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
          LATITUDE_API_KEY: ${{ secrets.LATITUDE_API_KEY }}
          JARVISLABS_API_KEY: ${{ secrets.JARVISLABS_API_KEY }}
          OPENRELAY_API_KEY: ${{ secrets.OPENRELAY_API_KEY }}
          SESTERCE_API_KEY: ${{ secrets.SESTERCE_API_KEY }}
          RUNCRATE_API_KEY: ${{ secrets.RUNCRATE_API_KEY }}
          GPUHUB_API_KEY: ${{ secrets.GPUHUB_API_KEY }}
          SWISSGPU_API_KEY: ${{ secrets.SWISSGPU_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          IONET_API_KEY: ${{ secrets.IONET_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          MESHIVE_API_KEY: ${{ secrets.MESHIVE_API_KEY }}
          GCORE_API_KEY: ${{ secrets.GCORE_API_KEY }}
